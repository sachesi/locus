[package]
name = "locus"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "A GTK4 system monitor: processes, processor, memory, network and disks"
repository = "https://github.com/sachesi/locus"
readme = "README.md"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
async-channel = "2"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
libc = "0.2"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
